name: Deploy waiting room

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Sync Access configuration secrets
        env:
          ACCESS_ADMIN_EMAIL: ${{ secrets.CLOUDFLARE_ACCESS_ADMIN_EMAIL }}
          ACCESS_AUDIENCE: ${{ secrets.CLOUDFLARE_ACCESS_AUDIENCE }}
          ACCESS_INTAKE_EMAIL: ${{ secrets.CLOUDFLARE_ACCESS_INTAKE_EMAIL }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
        run: |
          printf '%s' "$ACCESS_ADMIN_EMAIL" | npx wrangler secret put ADMIN_EMAIL
          printf '%s' "$ACCESS_AUDIENCE" | npx wrangler secret put ACCESS_AUDIENCE
          printf '%s' "$ACCESS_INTAKE_EMAIL" | npx wrangler secret put INTAKE_EMAIL
          printf '%s' "$ACCESS_TEAM_DOMAIN" | npx wrangler secret put ACCESS_TEAM_DOMAIN

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
