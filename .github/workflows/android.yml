name: Build Android TV app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          # GitHub-hosted Ubuntu runners provide the SDK, but setup-android can
          # replace its current command-line tools with an older distribution
          # and then request the obsolete `tools` package. Use the runner's
          # supported sdkmanager directly instead.
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit 2>/dev/null || true)"
          if [[ -z "$sdkmanager_path" ]]; then
            echo "Could not find sdkmanager under $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          sdkmanager_dir="$(dirname "$sdkmanager_path")"
          echo "$sdkmanager_dir" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          # sdkmanager exits after the last license and closes stdin; with
          # pipefail enabled, `yes` then reports SIGPIPE as a false failure.
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          if [[ "$license_status" -ne 0 ]]; then
            exit "$license_status"
          fi
          "$sdkmanager_path" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run Android tests
        working-directory: android
        run: gradle test

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: waiting-room-tv-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
